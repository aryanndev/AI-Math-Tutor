<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathBot — AI Math Tutor</title>
    <meta name="description" content="Chat with MathBot — your AI-powered math tutor that solves and explains problems step-by-step.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <!-- Marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- MathJax for LaTeX -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$']],
                displayMath: [['$$', '$$']],
                processEscapes: true,
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
            },
            startup: { typeset: false }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>

<!-- Animated background -->
<div class="bg-grid"></div>
<div class="bg-orb orb-1"></div>
<div class="bg-orb orb-2"></div>
<div class="bg-orb orb-3"></div>

<div class="app-shell">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <span class="logo-icon">∑</span>
                <span class="logo-text">MathBot</span>
            </div>
            <button class="sidebar-toggle" id="sidebar-toggle" title="Toggle sidebar" aria-label="Toggle sidebar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
        </div>

        <button class="new-chat-btn" id="new-chat-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>New Chat</span>
        </button>

        <div class="sidebar-section-label">Recent Chats</div>
        <div class="chat-history-list" id="chat-history-list">
            <!-- Dynamically populated -->
        </div>

        <div class="sidebar-footer">
            <div class="model-badge">
                <span class="model-dot"></span>
                <span>Gemini AI</span>
            </div>
        </div>
    </aside>

    <!-- Main chat area -->
    <main class="chat-main" id="chat-main">

        <!-- Top bar -->
        <header class="chat-header">
            <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Open menu">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <div class="chat-title-area">
                <h1 class="chat-title" id="chat-title">MathBot</h1>
                <span class="chat-subtitle">Your AI math tutor</span>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="clear-chat-btn" title="Clear chat" aria-label="Clear chat">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
                </button>
            </div>
        </header>

        <!-- Messages area -->
        <div class="messages-area" id="messages-area">
            <!-- Welcome screen shown when no messages -->
            <div class="welcome-screen" id="welcome-screen">
                <div class="welcome-icon">∑</div>
                <h2>Hi, I'm MathBot!</h2>
                <p>Your AI-powered math tutor. Ask me anything — from basic arithmetic to advanced calculus. I'll solve it and explain it step by step.</p>
                <div class="suggestion-chips">
                    <button class="chip" data-msg="Solve x^2 - 5x + 6 = 0">Solve x² - 5x + 6 = 0</button>
                    <button class="chip" data-msg="What is the derivative of sin(x)*x^2?">Derivative of sin(x)·x²</button>
                    <button class="chip" data-msg="Explain the Pythagorean theorem">Pythagorean theorem</button>
                    <button class="chip" data-msg="What is the integral of 1/x?">Integral of 1/x</button>
                    <button class="chip" data-msg="Solve the system: 2x + y = 5, x - y = 1">System of equations</button>
                    <button class="chip" data-msg="What is a prime number?">What is a prime?</button>
                </div>
            </div>
        </div>

        <!-- Typing indicator (inside messages area) -->
        <div class="typing-indicator hidden" id="typing-indicator">
            <div class="bot-avatar small">∑</div>
            <div class="typing-bubble">
                <span></span><span></span><span></span>
            </div>
        </div>

        <!-- Input bar -->
        <div class="input-bar-wrapper">
            <div class="input-bar" id="input-bar">
                <textarea
                    id="chat-input"
                    placeholder="Ask me a math question..."
                    rows="1"
                    autocomplete="off"
                    aria-label="Math question input"
                ></textarea>
                <button class="send-btn" id="send-btn" disabled aria-label="Send message">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
            </div>
            <p class="input-hint">MathBot uses Gemini AI for both solving and explaining.</p>
        </div>

    </main>
</div>

<script src="/static/script.js"></script>
</body>
</html>
